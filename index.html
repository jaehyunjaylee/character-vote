<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캐릭터 투표</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#ffffff;
    --tint:#fbf5f6;        /* 섹션 바탕 */
    --panel:#f3eaec;       /* 폰 목업 바탕 */
    --ink:#1c1819;
    --sub:#7a7174;
    --line:#ece4e6;
    --accent:#d24d6e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:24px}
  body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
       font-size:16px;line-height:1.7;letter-spacing:-0.012em;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left));padding-right:max(20px, env(safe-area-inset-right))}

  /* ── 상단 ───────────────────────────── */
  .top{text-align:center;padding:72px 0 44px}
  .top .tag{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);background:var(--tint);
            padding:5px 12px;border-radius:999px;margin-bottom:18px}
  .top h1{font-size:34px;font-weight:700;letter-spacing:-0.035em;line-height:1.3;margin-bottom:18px}
  .top p{color:var(--sub);font-size:17px;line-height:1.85}

  /* ── 한눈에 보기 ─────────────────────── */
  .lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{all:unset;box-sizing:border-box;position:relative;cursor:pointer;border-radius:22px;overflow:hidden;
        outline:0 solid transparent;transition:outline-color .15s, transform .15s}
  .card img{width:100%;aspect-ratio:1/1;object-fit:cover}
  .card .badge{position:absolute;left:16px;top:16px;width:40px;height:40px;border-radius:50%;
               background:rgba(255,255,255,.92);display:grid;place-items:center;font-weight:700;font-size:18px}
  .card .mark{position:absolute;right:16px;top:16px;width:30px;height:30px;border-radius:50%;
              border:2px solid rgba(255,255,255,.95);background:rgba(255,255,255,.35);display:grid;place-items:center}
  .card .mark svg{width:16px;height:16px;opacity:0}
  .card .more{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;font-size:14px;font-weight:600;color:#fff;
              background:linear-gradient(to top, rgba(40,20,26,.38), rgba(40,20,26,0));text-align:right}
  .card:hover{transform:translateY(-2px)}
  .card:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
  .card[aria-checked="true"]{outline:4px solid var(--accent);outline-offset:-4px}
  .card[aria-checked="true"] .mark{background:var(--accent);border-color:var(--accent)}
  .card[aria-checked="true"] .mark svg{opacity:1}
  .lineup-note{text-align:center;color:var(--sub);font-size:14px;margin-top:18px}

  /* ── 자세히 ─────────────────────────── */
  .detail{margin-top:96px}
  .cand{background:var(--tint);border-radius:28px;padding:48px;margin-bottom:24px;
        display:grid;grid-template-columns:minmax(0,1fr) 375px;gap:48px;align-items:center}
  .cand .info{display:flex;flex-direction:column;gap:14px;min-width:0}
  .cand .head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
  .cand .head b{font-size:44px;font-weight:700;line-height:1;letter-spacing:-0.03em}
  .cand .head span{font-size:15px;color:var(--sub)}
  .cand .info img{width:100%;border-radius:16px}
  .cand .main{aspect-ratio:4/3;object-fit:cover}
  .cand .face{aspect-ratio:16/9;object-fit:cover}
  .cap{font-size:13px;font-weight:600;color:var(--sub);margin:6px 0 -6px}
  .cand .phone{background:var(--panel);border-radius:24px;padding:36px 0;display:flex;justify-content:center;align-self:stretch;align-items:center}
  .cand .phone img{width:100%;max-width:331px}
  .choose{all:unset;box-sizing:border-box;cursor:pointer;margin-top:6px;text-align:center;padding:15px;border-radius:14px;
          background:var(--bg);border:1.5px solid var(--line);font-weight:600;transition:all .15s}
  .choose:hover{border-color:var(--accent);color:var(--accent)}
  .choose:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .choose[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  .end{height:150px}

  /* ── 하단 투표 독 ─────────────────────── */
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:10;
        display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px;
        box-shadow:0 10px 30px rgba(60,30,40,.12);width:max-content;max-width:calc(100% - 32px)}
  .seg{display:flex;gap:4px}
  .seg button{all:unset;box-sizing:border-box;cursor:pointer;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
              font-weight:700;font-size:17px;color:var(--sub);transition:all .15s}
  .seg button:hover{background:var(--tint);color:var(--ink)}
  .seg button[aria-checked="true"]{background:var(--ink);color:#fff}
  .seg button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
  .go{all:unset;box-sizing:border-box;cursor:pointer;height:48px;padding:0 26px;border-radius:14px;background:var(--accent);color:#fff;
      font-weight:700;white-space:nowrap;display:grid;place-items:center}
  .go[aria-disabled="true"]{background:var(--line);color:var(--sub);cursor:default}
  .go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .dock .voted{padding:0 14px;font-size:15px;color:var(--sub);white-space:nowrap;height:48px;display:grid;place-items:center}
  .dock .voted b{color:var(--ink)}

  /* ── 완료 ────────────────────────────── */
  .done{position:fixed;inset:0;background:rgba(28,24,25,.42);display:grid;place-items:center;z-index:20;padding:20px}
  .done[hidden]{display:none}
  .done .box{background:#fff;border-radius:24px;padding:36px 30px 28px;max-width:340px;width:100%;text-align:center}
  .done img{width:132px;height:132px;object-fit:cover;border-radius:50%;margin:0 auto 20px}
  .done h3{font-size:20px;letter-spacing:-0.02em;margin-bottom:6px}
  .done p{color:var(--sub);font-size:15px}
  .done button{all:unset;cursor:pointer;margin-top:24px;padding:13px 0;width:100%;border-radius:12px;background:var(--ink);color:#fff;font-weight:600}

  @media (max-width:860px){
    .top{padding:48px 0 32px}
    .top h1{font-size:26px}
    .top p{font-size:15.5px}
    .lineup{gap:10px}
    .card{border-radius:16px}
    .card .badge{left:8px;top:8px;width:30px;height:30px;font-size:14px}
    .card .mark{right:8px;top:8px;width:24px;height:24px}
    .card .more{display:none}
    .detail{margin-top:56px}
    .cand{grid-template-columns:1fr;padding:24px 18px;gap:20px;border-radius:22px;margin-bottom:16px}
    .cand .head b{font-size:34px}
    .cand .phone{padding:24px 0}
    .cand .phone img{max-width:300px}
    .seg button{width:44px;height:44px}
    .go{height:44px;padding:0 18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <span class="tag">캐릭터 투표</span>
    <h1>어떤 캐릭터가 마음에 드시나요?</h1>
    <p>안녕하세요.<br>
       널싱랩과 함께할 새로운 서비스를 준비하고 있습니다.<br>
       이 서비스를 대표할 캐릭터를 찾고 있습니다.<br>
       가장 마음에 드는 캐릭터 하나에 투표해 주세요.</p>
  </header>

  <div class="lineup" role="radiogroup" aria-label="캐릭터 고르기">
    <button class="card" role="radio" aria-checked="false" data-id="A">
      <img src="img/pink-main.jpg" alt="A 캐릭터">
      <span class="badge">A</span>
      <span class="mark"><svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.3 6.6 11.4 12.5 5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
    <button class="card" role="radio" aria-checked="false" data-id="B">
      <img src="img/lash-main.jpg" alt="B 캐릭터">
      <span class="badge">B</span>
      <span class="mark"><svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.3 6.6 11.4 12.5 5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
    <button class="card" role="radio" aria-checked="false" data-id="C">
      <img src="img/white-main.jpg" alt="C 캐릭터">
      <span class="badge">C</span>
      <span class="mark"><svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.3 6.6 11.4 12.5 5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
  </div>
  <p class="lineup-note">마음에 드는 캐릭터를 누르고, 아래 <b>투표하기</b>를 눌러 주세요.<br>표정과 앱 화면은 아래로 내려 자세히 볼 수 있습니다.</p>

  <section class="detail" aria-label="자세히 보기">
    <article class="cand" id="A">
      <div class="info">
        <div class="head"><b>A</b></div>
        <img class="main" src="img/pink-main.jpg" alt="A 캐릭터">
        <div class="cap">표정</div>
        <img class="face" src="img/pink-face.jpg" alt="A 캐릭터 표정 4가지">
        <button class="choose" aria-pressed="false" data-id="A">A 고르기</button>
      </div>
      <div class="phone"><img src="img/pink-home.webp" alt="A 캐릭터를 넣은 앱 화면"></div>
    </article>

    <article class="cand" id="B">
      <div class="info">
        <div class="head"><b>B</b></div>
        <img class="main" src="img/lash-main.jpg" alt="B 캐릭터">
        <div class="cap">표정</div>
        <img class="face" src="img/lash-face.jpg" alt="B 캐릭터 표정 4가지">
        <button class="choose" aria-pressed="false" data-id="B">B 고르기</button>
      </div>
      <div class="phone"><img src="img/lash-home.webp" alt="B 캐릭터를 넣은 앱 화면"></div>
    </article>

    <article class="cand" id="C">
      <div class="info">
        <div class="head"><b>C</b></div>
        <img class="main" src="img/white-main.jpg" alt="C 캐릭터">
        <div class="cap">표정</div>
        <img class="face" src="img/white-face.jpg" alt="C 캐릭터 표정 4가지">
        <button class="choose" aria-pressed="false" data-id="C">C 고르기</button>
      </div>
      <div class="phone"><img src="img/white-home.webp" alt="C 캐릭터를 넣은 앱 화면"></div>
    </article>
  </section>

  <div class="end"></div>
</div>

<!-- 하단 투표 -->
<div class="dock" id="dock">
  <div class="seg" role="radiogroup" aria-label="투표할 캐릭터" id="seg">
    <button role="radio" aria-checked="false" data-id="A">A</button>
    <button role="radio" aria-checked="false" data-id="B">B</button>
    <button role="radio" aria-checked="false" data-id="C">C</button>
  </div>
  <button class="go" id="go" aria-disabled="true">투표하기</button>
  <div class="voted" id="voted" hidden></div>
</div>

<div class="done" id="done" hidden role="dialog" aria-modal="true" aria-labelledby="done-title">
  <div class="box">
    <img id="done-img" src="" alt="">
    <h3 id="done-title">투표가 완료되었습니다.</h3>
    <p id="done-text">참여해 주셔서 감사합니다.</p>
    <button id="done-close">확인</button>
  </div>
</div>

<script>
/* ── 투표함 연결: 구글 설문지 ─────────────────────────────
   formAction : 설문지 주소의 /viewform 을 /formResponse 로 바꾼 것
   entry      : 질문 칸 번호
   설문 질문의 선택지는 A안, B안, C안 (페이지는 picked + '안' 을 보냄) */
const CONFIG = {
  formAction: 'https://docs.google.com/forms/d/e/1FAIpQLSdDV4s-9kaSyYp10p8mqWIeUtuJaaxgS8w9A1UiHd3aZwEnpg/formResponse',
  entry: 'entry.1735767534'
};

const IMG = { A: 'img/pink-main.jpg', B: 'img/lash-main.jpg', C: 'img/white-main.jpg' };
const KEY = 'nl-char-vote';
let picked = null, sending = false, voted = null;
try { voted = localStorage.getItem(KEY); } catch (e) {}

const $go = document.getElementById('go');
const $seg = document.getElementById('seg');
const $voted = document.getElementById('voted');

function render() {
  document.querySelectorAll('.card, .seg button').forEach(el =>
    el.setAttribute('aria-checked', String(el.dataset.id === picked)));
  document.querySelectorAll('.choose').forEach(el => {
    const on = el.dataset.id === picked;
    el.setAttribute('aria-pressed', String(on));
    el.textContent = on ? el.dataset.id + ' 골랐습니다' : el.dataset.id + ' 고르기';
  });

  if (voted) {
    $seg.hidden = true; $go.hidden = true; $voted.hidden = false;
    $voted.textContent = '';
    const b = document.createElement('b'); b.textContent = voted;
    $voted.append(b, document.createTextNode('에 투표했습니다. 감사합니다.'));
    return;
  }
  $seg.hidden = false; $go.hidden = false; $voted.hidden = true;
  $go.setAttribute('aria-disabled', String(!picked || sending));
  $go.textContent = sending ? '보내는 중…' : (picked ? picked + '에 투표하기' : '투표하기');
}

function pick(id) { if (voted) return; picked = id; render(); }
document.querySelectorAll('.card, .choose, .seg button').forEach(el =>
  el.addEventListener('click', () => pick(el.dataset.id)));

$go.addEventListener('click', async () => {
  if (!picked || sending || voted) return;
  sending = true; render();
  try {
    await fetch(CONFIG.formAction, {
      method: 'POST', mode: 'no-cors',
      body: new URLSearchParams({ [CONFIG.entry]: picked + '안' })
    });
    voted = picked;
    try { localStorage.setItem(KEY, voted); } catch (e) {}
    document.getElementById('done-img').src = IMG[voted];
    document.getElementById('done-text').textContent = voted + '에 투표했습니다. 참여해 주셔서 감사합니다.';
    document.getElementById('done').hidden = false;
    document.getElementById('done-close').focus();
  } catch (e) {
    $go.textContent = '다시 눌러 주세요';
    sending = false; return;
  }
  sending = false; render();
});

document.getElementById('done-close').addEventListener('click', () => { document.getElementById('done').hidden = true; });
render();
</script>
</body>
</html>
