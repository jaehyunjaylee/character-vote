<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캐릭터 투표</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#fff;color:#1c1819;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
       -webkit-font-smoothing:antialiased;letter-spacing:-0.012em;display:grid;place-items:center;padding:24px;text-align:center}
  .tag{display:inline-block;font-size:13px;font-weight:600;color:#d24d6e;background:#fbf5f6;padding:5px 12px;border-radius:999px;margin-bottom:18px}
  h1{font-size:30px;font-weight:700;letter-spacing:-0.035em;line-height:1.3;margin-bottom:14px}
  p{color:#7a7174;font-size:16px;line-height:1.8}
  @media (max-width:600px){h1{font-size:24px}p{font-size:15px}}
</style>
</head>
<body>
  <main>
    <span class="tag">캐릭터 투표</span>
    <h1>투표가 마감되었습니다.</h1>
    <p>참여해 주셔서 감사합니다.</p>
  </main>
</body>
</html>
